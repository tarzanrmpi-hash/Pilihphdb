<meta name="viewport" content="width=device-width,initial-scale=1">

button.on{background:#6aa8ff22;border-color:var(--a);color:#cfe2ff}

label{display:inline-flex;gap:6px;align-items:center}

header b{font-size:17px;letter-spacing:.3px;margin-right:18px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
header button{border-radius:999px;padding:6px 16px;background:transparent;color:var(--m)}
header button.on{background:var(--g);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 14px #5b7cff55}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 20px}
.bar>b{background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:6px 20px 30px}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;overflow:hidden;position:relative;transition:.18s;box-shadow:0 6px 20px #0004}
.card:hover{transform:translateY(-3px);border-color:#4a5166;box-shadow:0 12px 30px #0007}
.card.sel{border-color:var(--ok);box-shadow:0 0 0 2px #3ddc8466,0 12px 30px #0007}
.card.sel::after{content:"★ DIPILIH";position:absolute;top:8px;left:8px;background:var(--ok);color:#06210f;font:700 10px sans-serif;padding:3px 8px;border-radius:99px;letter-spacing:.5px}
.card.cmp{outline:2px solid var(--a);outline-offset:2px}
.card>img,.card>canvas{width:100%;height:160px;object-fit:contain;background:repeating-conic-gradient(#0b0c10 0 25%,#111319 0 50%) 0 0/16px 16px;display:block;cursor:zoom-in}
.card>canvas{height:auto;cursor:default}
.card .r{display:flex;gap:5px;padding:8px;align-items:center}.card .r button{padding:4px 9px;border-radius:8px}
.nm{font-size:11.5px;color:var(--m);padding:6px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm{padding:0}

#ov[hidden]{display:none}
.panes{flex:1;display:grid;gap:8px;min-height:0;padding:4px 14px 14px}
.pane{position:relative;overflow:hidden;background:#000;border:1px solid var(--b);border-radius:14px;touch-action:none;cursor:grab;min-height:0;box-shadow:0 10px 40px #000a}
.pane:active{cursor:grabbing}
.pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
.pt{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2;align-items:center;background:#0b0c10b3;backdrop-filter:blur(8px);padding:5px;border-radius:12px;border:1px solid #ffffff1a}
.pt button{padding:3px 9px}.pt .nm{padding:0 8px;background:none!important}
#st{position:relative;height:62vh;overflow:hidden;background:#000;cursor:grab;touch-action:none;border-radius:14px;border:1px solid var(--b);box-shadow:0 10px 40px #0008}
#ci{position:absolute;max-width:none;pointer-events:none;user-select:none}
#bx{position:absolute;box-shadow:0 0 0 9999px #000b;border:2px solid #fff;pointer-events:none;background:linear-gradient(#fff3 1px,transparent 1px) 0 33.3%/100% 33.3%,linear-gradient(90deg,#fff3 1px,transparent 1px) 33.3% 0/33.3% 100%}
p{padding:30px 20px;color:var(--m)}
#lg{color:var(--ok)}

body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:fl 18s ease-in-out infinite alternate}
body::before{background:#4f6bff;top:-25vmax;left:-15vmax}body::after{background:#b24bff;bottom:-30vmax;right:-15vmax;animation-delay:-9s}

.ico{width:96px;height:96px;margin:0 auto 18px;display:grid;place-items:center;font-size:46px;border-radius:28px;background:var(--g);box-shadow:0 14px 40px #6a5cff77;animation:bob 3.5s ease-in-out infinite}

.hero h2{margin:0 0 8px;font-size:26px;letter-spacing:.2px}

.cta button{padding:13px 26px;font-size:15px;border-radius:14px}
.hero small{display:block;color:var(--m);margin-bottom:26px}
.steps{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding-top:20px;border-top:1px solid #ffffff14;color:var(--m);font-size:12.5px}
.steps i{opacity:.5;font-style:normal}

.bb{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 20px;background:#12141af2;backdrop-filter:blur(14px);border-top:1px solid var(--b);box-shadow:0 -10px 30px #0008}

main{padding-bottom:96px}
.bb{justify-content:flex-end}
.bar.tabs{padding-bottom:2px;justify-content:flex-start}

.stp{display:flex;gap:4px;padding:5px;border-radius:999px;border:2px solid transparent;background:linear-gradient(#10121a,#10121a) padding-box,linear-gradient(#ff9f43,#ff9f43) border-box;box-shadow:0 0 24px #ff9f4344}

.brand div{line-height:1.05}
.brand small{display:block;font:800 10.5px Montserrat,"Segoe UI",sans-serif;letter-spacing:.42em;color:var(--m);text-transform:uppercase;padding-left:2px}

.hero h2{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:30px}
.warn{border-color:#ff9f43;color:#ffd199}.warn:hover{background:#ff9f4322}

.cta .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1d2030;border:1px solid var(--a);padding:10px 20px;border-radius:12px;z-index:50;box-shadow:0 10px 30px #000a}
.tabs .pri{margin-left:6px}

.stk{position:sticky;top:var(--hh,70px);z-index:4;background:#0f1117f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--b);margin-bottom:12px}
.bar.tabs{padding:4px 20px 12px}

header{justify-content:center;gap:14px 22px}.brand{margin-right:0}
.stk .bar,.stk .bar.tabs{justify-content:center}

$('#m').innerHTML=`<div class=stk><div class=bar><button data-a=dir class=warn>📂 Pilih Folder</button><span>${L.length} foto${F?' final':` · ${ns} dipilih ★`}</span><button data-a=cmp class=on>⚖ Bandingkan (${S.cmp.size}/4)</button><button data-a=reup class=warn>🔄 Upload Ulang Photo</button></div><div class="bar tabs">${tabs}</div></div>${L.length?`<div class=grid>${L.map(card).join('')}</div>`:(S.P.length?'<p style=text-align:center>Belum ada foto di pilihan ini. Tandai ★ di pilihan sebelumnya lalu klik “Lanjut”.</p>':EMPTY)}${S.P.length?`<div class=bb><div class=acts>${acts}</div></div>`:''}`}
const EMPTY=`<div class=empty><div class=hero><div class=ico><svg viewBox="0 0 48 48" width="56" height="56" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h5l2.5-4h13l2.5 4h5a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V20a3 3 0 0 1 3-3z"/><circle cx="24" cy="27" r="7"/><circle cx="24" cy="27" r="2.5" fill="#fff"/></svg></div><h2>Mulai pilih foto terbaik Anda</h2><p>Tambahkan foto dari komputer, lalu seleksi, bandingkan, crop, beri bingkai, dan simpan.</p><div class=chips><span>JPG</span><span>CR2</span><span>CR3</span><span>NEF</span><span>ARW</span></div><div class=cta><button data-a=dir class=warn>📂 Pilih Folder</button></div><small>atau seret &amp; lepas banyak folder / file sekaligus ke halaman ini — jumlah tidak dibatasi</small><div class=steps><span>① Seleksi</span><i>›</i><span>② Crop</span><i>›</i><span>③ Bingkai</span><i>›</i><span>④ Simpan</span></div></div></div>`;
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',async e=>{e.preventDefault();const ens=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean),out=[];if(!ens.length)return addFiles(e.dataTransfer.files);for(const en of ens)await walk(en,out);addFiles(out)});
/* ---------- viewer & compare ---------- */
function openV(ids,i,cm){V={ids,i,one:!cm,s:1,x:0,y:0};$('#ov').hidden=0;drawV()}
async function drawV(){const sh=V.one?[V.ids[V.i]]:V.ids,n=sh.length,P=sh.map(id=>S.P.find(p=>p.id==id));await Promise.all(P.map(gu));if(!V)return;
$('#ov').innerHTML=`<div class=bar><button data-a=close>✕ Tutup</button><button data-a=reset>Reset zoom</button>${V.one?'<button data-a=pv>◀</button><button data-a=nx>▶</button>':''}<span style="opacity:.7">Scroll = zoom · Geser = pindah · Klik 2x = zoom in/out${n>1?' · semua foto ikut zoom bersamaan':''}</span></div><div class=panes style="grid-template-columns:repeat(${n==3?3:Math.min(n,2)},1fr);grid-template-rows:repeat(${n>2&&n!=3?2:1},1fr)">${P.map(p=>`<div class=pane data-i=${p.id}><div class=pt><button data-a=rl>⟲</button><button data-a=rr>⟳</button><button data-a=sel class="${pkv(p)?'on':''}">${S.round=='F'?'✕ Keluarkan':'★ '+(pkv(p)?'Dipilih':'Pilih')}</button><span class=nm style="background:#000a">${p.name}</span></div><img src="${p.du}"></div>`).join('')}</div>`;tf()}
const tf=()=>document.querySelectorAll('#ov .pane img').forEach(i=>i.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`);
function zoomAt(pn,e,k){const r=pn.getBoundingClientRect(),cx=e.clientX-r.left-r.width/2,cy=e.clientY-r.top-r.height/2,ns=cp(V.s*k,1,30),kk=ns/V.s;V.x=cx-(cx-V.x)*kk;V.y=cy-(cy-V.y)*kk;V.s=ns;if(ns==1)V.x=V.y=0;tf()}
async function rot(p,d){p.rot=(p.rot+d+360)%360;p.cr=null;await apply(p);V?drawV():0;R()}
/* ---------- langkah 2: crop ---------- */
const ec=p=>p.cr||(p.cr={sz:'40x50',w:40,h:50,land:p.w>p.h,z:1,u:p.w/2,v:p.h/2});
function rg(p){const c=ec(p);let a=c.w/c.h;if(c.land!=(a>1))a=1/a;const rw=Math.min(p.w,p.h*a)/c.z,rh=rw/a,u=cp(c.u,rw/2,p.w-rw/2),v=cp(c.v,rh/2,p.h-rh/2);return{a,x:u-rw/2,y:v-rh/2,w:rw,h:rh}}
async function r2(){const p=S.fin[S.ci],c=ec(p),Z=['40x50','60x80','80x100'],du=await gu(p);if(S.step!=2)return;
$('#m').innerHTML=`<div class=bar>${S.fin.map((q,i)=>`<img src="${q.th}" data-a=pick data-v=${i} style="height:56px;border:2px solid ${i==S.ci?'var(--a)':'var(--b)'};border-radius:4px;cursor:pointer">`).join('')}</div>
<div class=bar>Ukuran (cm): ${Z.map(z=>`<button data-a=sz data-v=${z} class="${c.sz==z?'on':''}">${z}</button>`).join('')}<button data-a=sz data-v=c class="${c.sz=='c'?'on':''}">Custom</button><input id=cw type=number min=1 value=${c.w} style=width:70px> × <input id=ch type=number min=1 value=${c.h} style=width:70px>
<button data-a=ori data-v=0 class="${c.land?'':'on'}">▯ Portrait</button><button data-a=ori data-v=1 class="${c.land?'on':''}">▭ Landscape</button><button data-a=all>Terapkan ukuran ke semua foto</button><button data-a=step data-v=3 class=pri>Lanjut: Bingkai ▶</button></div>
<div class=bar data-i=${p.id} style=opacity:.85>Scroll = zoom · Geser = atur posisi crop · Klik 2x = reset · Putar foto: <button data-a=rl>⟲</button><button data-a=rr>⟳</button></div>
<div style="padding:0 14px"><div id=st><img id=ci src="${du}"><div id=bx></div></div></div>`;cl()}
function cl(){const p=S.fin[S.ci],c=ec(p),st=$('#st'),W=st.clientWidth,H=st.clientHeight;let a=c.w/c.h;if(c.land!=(a>1))a=1/a;
let bw=W*.9,bh=bw/a;if(bh>H*.9){bh=H*.9;bw=bh*a}const mn=Math.max(bw/p.w,bh/p.h),sc=mn*c.z;
c.u=cp(c.u,bw/2/sc,p.w-bw/2/sc);c.v=cp(c.v,bh/2/sc,p.h-bh/2/sc);
$('#ci').style.cssText=`width:${p.w*sc}px;height:${p.h*sc}px;left:${W/2-c.u*sc}px;top:${H/2-c.v*sc}px`;
$('#bx').style.cssText=`width:${bw}px;height:${bh}px;left:${(W-bw)/2}px;top:${(H-bh)/2}px`;CS={sc}}
/* ---------- langkah 3: bingkai ---------- */
async function paint(p,cv,W,full){const r=rg(p);let src,k=1;if(full){src=rcv(await decode(p.file,0),p.rot,0);k=src.width/p.w}else src=await ldi(await gu(p));
const ow=Math.round(full?r.w*k:W),oh=Math.round(ow/r.a);cv.width=ow;cv.height=oh;const x=cv.getContext('2d');x.drawImage(src,r.x*k,r.y*k,r.w*k,r.h*k,0,0,ow,oh);const f=S.fr[p.fr??-1];if(f)f.draw?f.draw(x,ow,oh):x.drawImage(f.img,0,0,ow,oh)}
function r3(){const o=p=>`<option value=-1>Tanpa bingkai</option>`+S.fr.map((f,i)=>`<option value=${i} ${(p.fr??-1)==i?'selected':''}>${f.n}</option>`).join('');
$('#m').innerHTML=`<div class=bar><button data-a=upf class=pri>＋ Upload Bingkai (PNG, bagian tengah transparan)</button><span style=opacity:.7>Klik bingkai = pakai untuk semua foto · atau pilih per foto di bawah</span><button data-a=step data-v=4 class=pri>Lanjut: Simpan ▶</button></div>
<div class=bar>${S.fr.map((f,i)=>`<div style=text-align:center data-a=fall data-v=${i}><canvas width=70 height=90 data-f=${i} style="background:#999;cursor:pointer;border-radius:4px"></canvas><div class=nm>${f.n}</div></div>`).join('')}<div data-a=fall data-v=-1 style="width:70px;height:90px;display:grid;place-items:center;border:1px dashed #666;cursor:pointer">Tanpa</div></div>
<div class=grid style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${S.fin.map(p=>`<div class=card data-i=${p.id}><canvas data-p=${p.id}></canvas><div class=r><span class=nm style=flex:1>${p.name}</span><select data-a=fs>${o(p)}</select></div></div>`).join('')}</div>`;
document.querySelectorAll('[data-f]').forEach(cv=>{const f=S.fr[cv.dataset.f],x=cv.getContext('2d');f.draw?f.draw(x,70,90):x.drawImage(f.img,0,0,70,90)});
document.querySelectorAll('[data-p]').forEach(cv=>paint(S.fin.find(p=>p.id==cv.dataset.p),cv,320))}
/* ---------- langkah 4: simpan ---------- */
function r4(){$('#m').innerHTML=`<div class=bar><b>${S.fin.length} foto final</b></div><div class=grid style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${S.fin.map(p=>{const c=ec(p),f=S.fr[p.fr??-1];return`<div class=card><img src="${p.th}" style=cursor:default><div class=nm>${p.name} — ${c.w}×${c.h} cm ${c.land?'landscape':'portrait'} — ${f?f.n:'tanpa bingkai'}</div></div>`}).join('')}</div>
<div class=bar><label><input type=checkbox id=k1 checked> Salin file asli (ekstensi asli, tanpa ZIP)</label><label><input type=checkbox id=k2 checked> Hasil crop + bingkai (.jpg)</label><button class=pri data-a=save>💾 Simpan ke Folder Komputer…</button><span id=lg></span></div>
<div class=bar style=opacity:.7>Catatan: file RAW (CR2/CR3/NEF/ARW) disalin utuh tanpa diubah. Hasil crop dibuat dari JPEG preview di dalam RAW dan disimpan sebagai .jpg.</div>`}
async function save(fb){const k1=$('#k1').checked,k2=$('#k2').checked;let dir=null;
$('#lg').textContent='⏳ Membuka jendela pilih folder…';
if(window.showDirectoryPicker){try{dir=await showDirectoryPicker({mode:'readwrite'})}catch(e){$('#lg').innerHTML=e.name=='AbortError'?'Dibatalkan — belum ada yang disimpan.':'<span style=color:#ffb86b>⚠ Tidak bisa memakai folder itu ('+e.name+': '+e.message+'). Buat folder baru dulu (mis. D:\\FotoFinal) lalu pilih folder itu — jangan pilih Desktop / Documents / Downloads langsung.</span>';return}}else if(!fb){const why=!window.isSecureContext?'Halaman dibuka lewat alamat yang dianggap tidak aman ('+location.origin+'). Buka lewat <b>http://localhost/...</b> atau <b>http://127.0.0.1/...</b> (bukan alamat IP / nama komputer).':'Browser ini tidak mendukung jendela pilih folder (Firefox / Safari / Brave bawaan). Gunakan <b>Google Chrome</b> atau <b>Microsoft Edge</b>.';$('#lg').innerHTML='<span style=color:#ffb86b>⚠ '+why+'</span> <button data-a=dlall>Tetap unduh satu per satu</button>';return}
const used=new Set(),un=n=>{let m=n,i=1;while(used.has(m.toLowerCase()))m=n.replace(/(\.\w+)$/,'_'+(++i)+'$1');used.add(m.toLowerCase());return m};
const wr=async(n,b)=>{if(dir){const h=await dir.getFileHandle(n,{create:true}),s=await h.createWritable();await s.write(b);await s.close()}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();await new Promise(r=>setTimeout(r,500))}};
let txt='DAFTAR FOTO FINAL\n\n',i=0;
try{for(const p of S.fin){$('#lg').textContent=`Menyimpan ${++i}/${S.fin.length}: ${p.name}`;const c=ec(p),f=S.fr[p.fr??-1];
if(k1)await wr(un(p.name),p.file);
if(k2){const cv=document.createElement('canvas');await paint(p,cv,0,true);const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.95));await wr(un(p.name.replace(/\.\w+$/,'')+`_crop_${c.w}x${c.h}${f?'_'+f.n.replace(/\s/g,''):''}.jpg`),b)}
txt+=`${p.name} | ${c.w}x${c.h} cm | ${c.land?'Landscape':'Portrait'} | Bingkai: ${f?f.n:'-'}\n`}
await wr('daftar_foto_final.txt',new Blob([txt],{type:'text/plain'}));$('#lg').textContent='✅ Selesai disimpan.'}catch(e){$('#lg').textContent='⚠ Gagal: '+e.message}}
/* ---------- render & event ---------- */
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
const sh=()=>document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');addEventListener('resize',sh);document.fonts&&document.fonts.ready.then(sh);
function render(){sh();$('#bk').hidden=S.step!=4;document.querySelectorAll('header [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==S.step));
if(S.step>1&&!S.fin.length){$('#m').innerHTML='<p style=padding:14px>Belum ada foto final. Di langkah Seleksi, tandai ★ lalu klik “Lanjut ke Crop”.</p>';return}
S.ci=cp(S.ci,0,Math.max(0,S.fin.length-1));[0,r1,r2,r3,r4][S.step]()}
function act(a,v,p){const L=LL();switch(a){
case'back':location.reload();break;
case'step':S.step=+v;render();break;case'add':$('#f1').click();break;case'dir':S.rep=0;$('#f2').click();break;
case'view':openV(L.map(q=>q.id),L.findIndex(q=>q.id==p.id));break;
case'rl':rot(p,-90);break;case'rr':rot(p,90);break;
case'sel':{const k=S.round;if(k=='F')p.fin=0;else if(pk(p)){p.fin=0;if(k<S.tabs)p.lvl=k}else if(k<S.tabs)p.lvl=k+1;else p.fin=1;V?drawV():0;render();break}
case'cp':if(S.cmp.has(p.id))S.cmp.delete(p.id);else if(S.cmp.size>=4)toast('Maksimal 4 foto untuk dibandingkan');else S.cmp.add(p.id);render();break;
case'cmp':if(S.cmp.size<2)return toast('Tandai 2–4 foto dengan tombol ⚖ dulu');openV([...S.cmp],0,1);break;
case'reup':S.rep=1;$('#f2').click();break;
case'tab':S.round=v=='F'?'F':+v;render();break;
case'addtab':S.tabs++;S.P.forEach(q=>{if(q.fin)q.lvl=S.tabs});S.round=S.tabs;render();break;
case'fin':{let t;if(S.round=='F')t=S.P.filter(q=>q.fin);else{const pc=L.filter(pkv);t=pc.length?pc:(S.round==1?[]:L)}if(!t.length)return toast(S.round=='F'?'Pilihan Final masih kosong':'Tandai ★ foto yang dipilih dulu');S.fin=t;S.ci=0;S.step=2;render();break}
case'close':V=null;$('#ov').hidden=1;render();break;
case'reset':V.s=1;V.x=V.y=0;tf();break;
case'pv':case'nx':V.i=(V.i+(a=='nx'?1:-1)+V.ids.length)%V.ids.length;V.s=1;V.x=V.y=0;drawV();break;
case'pick':S.ci=+v;render();break;
case'sz':{const c=ec(S.fin[S.ci]);if(v!='c'){[c.w,c.h]=v.split('x').map(Number)}c.sz=v;c.z=1;c.u=S.fin[S.ci].w/2;c.v=S.fin[S.ci].h/2;render();break}
case'ori':{const c=ec(S.fin[S.ci]);c.land=v=='1';c.z=1;render();break}
case'all':{const c=ec(S.fin[S.ci]);S.fin.forEach(q=>{const d=ec(q);Object.assign(d,{sz:c.sz,w:c.w,h:c.h,land:q.w>q.h,z:1,u:q.w/2,v:q.h/2})});render();break}
case'upf':$('#f3').click();break;
case'fall':S.fin.forEach(q=>q.fr=+v);render();break;
case'save':save();break;case'dlall':save(1);break}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName=='SELECT')return;const i=+(t.closest('[data-i]')?.dataset.i||0);act(t.dataset.a,t.dataset.v,S.P.find(q=>q.id==i))});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a=='fs'){S.fin.find(q=>q.id==t.closest('[data-i]').dataset.i).fr=+t.value;render()}
if(t.id=='cw'||t.id=='ch'){const p=S.fin[S.ci],c=ec(p);c.w=Math.max(1,+$('#cw').value);c.h=Math.max(1,+$('#ch').value);c.sz='c';c.z=1;c.u=p.w/2;c.v=p.h/2;render()}});
document.addEventListener('wheel',e=>{const pn=e.target.closest('.pane');if(pn&&V){e.preventDefault();zoomAt(pn,e,e.deltaY<0?1.2:1/1.2)}else if(e.target.closest('#st')){e.preventDefault();const c=S.fin[S.ci].cr;c.z=cp(c.z*(e.deltaY<0?1.1:1/1.1),1,12);cl()}},{passive:false});
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(e.target.closest('.pane')||e.target.closest('#st'))D={x:e.clientX,y:e.clientY,pane:!!e.target.closest('.pane')}});
addEventListener('pointermove',e=>{if(!D)return;const dx=e.clientX-D.x,dy=e.clientY-D.y;D.x=e.clientX;D.y=e.clientY;if(D.pane){V.x+=dx;V.y+=dy;tf()}else{const c=S.fin[S.ci].cr;c.u-=dx/CS.sc;c.v-=dy/CS.sc;cl()}});
addEventListener('pointerup',()=>D=null);
document.addEventListener('dblclick',e=>{const pn=e.target.closest('.pane');if(pn&&V){if(V.s>1){V.s=1;V.x=V.y=0;tf()}else zoomAt(pn,e,2.5)}else if(e.target.closest('#st')){const p=S.fin[S.ci],c=p.cr;c.z=1;c.u=p.w/2;c.v=p.h/2;cl()}});
addEventListener('keydown',e=>{if(!V)return;if(e.key=='Escape')act('close');if(V.one&&e.key=='ArrowRight')act('nx');if(V.one&&e.key=='ArrowLeft')act('pv')});
addEventListener('resize',()=>{if(S.step==2&&S.fin.length)cl()});
$('#f1').onchange=$('#f2').onchange=e=>{const fl=[...e.target.files];e.target.value='';if(S.rep&&fl.some(f=>/\.(jpe?g|cr2|cr3|nef|arw)$/i.test(f.name))){Q.length=0;S.P=[];S.fin=[];S.cmp.clear();LR.length=0;S.round=1;S.tabs=3;S.step=1;render()}S.rep=0;addFiles(fl)};
$('#f3').onchange=async e=>{for(const f of e.target.files)S.fr.push({n:f.name.replace(/\.\w+$/,''),img:await ldi(await rd(f))});e.target.value='';render()};
render();
</script></body></html>
